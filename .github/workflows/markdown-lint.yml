name: Markdown lint

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run test:resolver
